# Builds the Linux AppImage and attaches it to a GitHub Release.
#
# How to publish a new version:
#   1. In CHANGELOG.md rename "## [Unreleased]" to "## [1.0.0] - YYYY-MM-DD"
#      and set `version:` in budget/pubspec.yaml; commit and push.
#   2. git tag v1.0.0
#      git push origin v1.0.0
# The workflow runs, creates the release "v1.0.0" with the notes from
# CHANGELOG.md and uploads the AppImage.
#
# Third-party actions are pinned to exact commits so a hijacked tag can't
# change what runs here.
#
# It can also be started by hand from the Actions tab (workflow_dispatch):
# that only builds the AppImage and keeps it as a downloadable artifact.

name: Linux AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default; only the job that publishes gets write access.
permissions:
  contents: read

jobs:
  appimage:
    # Build on an older Ubuntu so the AppImage runs on most distributions
    # (an AppImage needs a glibc at least as new as the build system's).
    runs-on: ubuntu-22.04
    permissions:
      contents: write # needed to create the release
    defaults:
      run:
        working-directory: budget

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev file

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./linux/packaging/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cashew_Desktop-AppImage
          path: budget/build/appimage/*.AppImage

      # Release notes come from the matching "## [X.Y.Z]" section of
      # CHANGELOG.md. The build fails if that section is missing, so a release
      # is never published without notes.
      - name: Extract release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found=1; next } }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi
          cat release-notes.md

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Cashew Desktop ${{ github.ref_name }}
          files: budget/build/appimage/*.AppImage
          body_path: release-notes.md
